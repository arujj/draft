<style>
:root {
  --paper: #ffffff;
  --ink: #111111;
  --ink-2: #555555;
  --ink-3: #8a8a8a;
  --rule: #e3e3e3;
  --rule-2: #cfcfcf;
  --wash: #f5f5f3;
  --code-bg: #f4f4f2;
  --accent: #e2231a;
  --link: #1946d2;
  --on-ink: #ffffff;
  --sans: "Helvetica Neue", Helvetica, Inter, Arial, system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, "JetBrains Mono", Consolas, monospace;
  --bar: 52px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111111; --ink: #f1f1ef; --ink-2: #b4b4b0; --ink-3: #7c7c78;
    --rule: #2a2a2a; --rule-2: #3a3a3a; --wash: #1a1a1a; --code-bg: #1c1c1c;
    --accent: #ff4a3d; --link: #7aa2ff; --on-ink: #111111; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111111; --ink: #f1f1ef; --ink-2: #b4b4b0; --ink-3: #7c7c78;
  --rule: #2a2a2a; --rule-2: #3a3a3a; --wash: #1a1a1a; --code-bg: #1c1c1c;
  --accent: #ff4a3d; --link: #7aa2ff; --on-ink: #111111; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  display: flex; flex-direction: column;
  height: 100dvh; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }

/* ── Bar ─────────────────────────────────────────────── */
.bar {
  flex: none; height: calc(var(--bar) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--ink);
}
.bar-l, .bar-r { display: flex; align-items: center; gap: 4px; min-width: 0; }
.bar-r { justify-content: flex-end; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 2px; flex: none; }
.icon-btn:hover { background: var(--wash); }
.doc-title {
  font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 6px 8px; border-radius: 2px; text-align: left; min-width: 0;
}
.doc-title:hover { background: var(--wash); }

.seg { display: flex; gap: 22px; height: 100%; }
.seg button {
  height: 100%; font-weight: 500; color: var(--ink-3);
  border-bottom: 3px solid transparent; padding-top: 3px; letter-spacing: -0.005em;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
.seg .wide-only { display: none; }

.btn {
  height: 32px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 2px;
  font-weight: 600; font-size: 13px; letter-spacing: 0.01em; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--ink); color: var(--on-ink); }
.btn.primary:hover { background: var(--ink); opacity: .86; }
.btn.done { background: var(--accent) !important; border-color: var(--accent); color: #fff !important; opacity: 1 !important; }
.btn .sub { font-weight: 400; opacity: .7; }

/* ── Panes ───────────────────────────────────────────── */
.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; }
.pane { min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
.panes[data-view="write"] #outPane { display: none; }
.panes[data-view="preview"] #srcPane { display: none; }
.panes[data-view="split"] { grid-template-columns: 1fr 1fr; }
.panes[data-view="split"] #srcPane { border-right: 1px solid var(--rule); }

#srcPane { display: flex; }
#src {
  flex: 1; width: 100%; max-width: 820px; margin: 0 auto; min-height: 100%;
  border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
  font: 14px/1.65 var(--mono); tab-size: 2;
  padding: 32px max(16px, env(safe-area-inset-right)) 40vh max(16px, env(safe-area-inset-left));
  caret-color: var(--accent);
}
#src::placeholder { color: var(--ink-3); }
.panes[data-view="write"] #src { padding-left: max(28px, env(safe-area-inset-left)); padding-right: max(28px, env(safe-area-inset-right)); }

/* ── Status ──────────────────────────────────────────── */
.status {
  flex: none; display: flex; justify-content: space-between; gap: 16px;
  padding: 7px max(16px, env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  border-top: 1px solid var(--rule);
  font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: .02em;
}
.status .keys { display: none; }
kbd { font: inherit; }

/* ── Rendered Markdown ───────────────────────────────── */
.md {
  max-width: 820px; margin: 0 auto;
  padding: 32px 28px 30vh;
  font-size: 16px; line-height: 1.6; word-wrap: break-word; color: var(--ink);
}
.md > :first-child { margin-top: 0 !important; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-weight: 700; line-height: 1.22; letter-spacing: -0.015em; margin: 1.6em 0 .6em; }
.md h1 { font-size: 2em; letter-spacing: -0.025em; padding-bottom: .3em; border-bottom: 1px solid var(--rule); }
.md h2 { font-size: 1.45em; padding-bottom: .3em; border-bottom: 1px solid var(--rule); }
.md h3 { font-size: 1.2em; }
.md h4 { font-size: 1em; }
.md h5 { font-size: .9em; }
.md h6 { font-size: .85em; color: var(--ink-2); }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md table, .md dl { margin: 0 0 1em; }
.md a { color: var(--link); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md strong { font-weight: 700; }
.md ul, .md ol { padding-left: 1.75em; }
.md li + li { margin-top: .25em; }
.md li > ul, .md li > ol { margin: .25em 0 0; }
.md li.task { list-style: none; }
.md li.task > input { margin: 0 .5em .2em -1.5em; vertical-align: middle; accent-color: var(--ink); width: 14px; height: 14px; cursor: pointer; }
.md blockquote { padding: 0 1em; color: var(--ink-2); border-left: 3px solid var(--ink); }
.md hr { height: 1px; border: 0; background: var(--ink); margin: 2em 0; }
.md img { max-width: 100%; }
.md code, .md kbd { font-family: var(--mono); font-size: .86em; }
.md :not(pre) > code { background: var(--code-bg); padding: .15em .38em; border-radius: 3px; }
.md kbd { border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: 3px; padding: .05em .35em; }
.md pre { position: relative; background: var(--code-bg); padding: 16px; overflow: auto; border-radius: 3px; line-height: 1.5; }
.md pre code { font-size: 13.5px; background: none; padding: 0; white-space: pre; }
.md table { border-collapse: collapse; display: block; width: max-content; max-width: 100%; overflow: auto; font-variant-numeric: tabular-nums; }
.md th, .md td { padding: 7px 14px; border: 1px solid var(--rule-2); text-align: left; vertical-align: top; }
.md th { font-weight: 700; background: var(--wash); }
.md th[align="center"], .md td[align="center"] { text-align: center; }
.md th[align="right"], .md td[align="right"] { text-align: right; }
.md details { margin: 0 0 1em; }
.md summary { cursor: pointer; font-weight: 600; }
.md .empty { color: var(--ink-3); }

.copy-code {
  position: absolute; top: 8px; right: 8px; height: 26px; padding: 0 9px;
  font: 600 11px var(--sans); letter-spacing: .03em;
  background: var(--paper); border: 1px solid var(--rule-2); border-radius: 2px; color: var(--ink-2);
  opacity: 0; transition: opacity .12s;
}
.md pre:hover .copy-code, .copy-code:focus-visible { opacity: 1; }
@media (hover: none) { .copy-code { opacity: 1; } }
.copy-code.done { background: var(--accent); color: #fff; border-color: var(--accent); }

/* highlight.js — restrained */
.hljs-comment, .hljs-quote { color: var(--ink-3); font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-built_in, .hljs-type, .hljs-doctag { color: var(--ink); font-weight: 700; }
.hljs-string, .hljs-regexp, .hljs-addition, .hljs-template-variable { color: #b3261e; }
.hljs-number, .hljs-symbol, .hljs-bullet, .hljs-variable.language_ { color: #1946d2; }
.hljs-title, .hljs-section, .hljs-function .hljs-title { color: var(--ink); font-weight: 600; }
.hljs-attr, .hljs-attribute, .hljs-name, .hljs-tag, .hljs-property { color: #5b5b5b; }
.hljs-meta { color: var(--ink-3); }
.hljs-deletion { color: #b3261e; }
:root[data-theme="dark"] .hljs-string, :root[data-theme="dark"] .hljs-addition { color: #ff8a80; }
:root[data-theme="dark"] .hljs-number { color: #8fb0ff; }
:root[data-theme="dark"] .hljs-attr, :root[data-theme="dark"] .hljs-tag, :root[data-theme="dark"] .hljs-name { color: #b4b4b0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .hljs-string, :root:not([data-theme="light"]) .hljs-addition { color: #ff8a80; }
  :root:not([data-theme="light"]) .hljs-number { color: #8fb0ff; }
  :root:not([data-theme="light"]) .hljs-attr, :root:not([data-theme="light"]) .hljs-tag, :root:not([data-theme="light"]) .hljs-name { color: #b4b4b0; }
}

/* ── Drawer ──────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; bottom: 0; left: 0; width: min(340px, 86vw); z-index: 21;
  background: var(--paper); border-right: 1px solid var(--ink);
  transform: translateX(-101%); transition: transform .22s cubic-bezier(.2,.7,.2,1);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top); padding-left: env(safe-area-inset-left);
}
.drawer.open { transform: none; }
.drawer-head { height: var(--bar); flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px; border-bottom: 1px solid var(--ink); }
.drawer-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.note-list { flex: 1; overflow: auto; margin: 0; padding: 0; list-style: none; }
.note-list li { border-bottom: 1px solid var(--rule); }
.note-list button { width: 100%; text-align: left; display: grid; grid-template-columns: 30px 1fr; gap: 0 6px; padding: 13px 20px 13px 16px; }
.note-list button:hover { background: var(--wash); }
.note-list .n { font: 11px/1.9 var(--mono); color: var(--ink-3); }
.note-list .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-list .d { grid-column: 2; font-size: 12px; color: var(--ink-3); }
.note-list [aria-current="true"] { box-shadow: inset 4px 0 0 var(--accent); }
.note-list [aria-current="true"] .n { color: var(--accent); }
.drawer-foot { flex: none; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--rule); font-size: 11px; color: var(--ink-3); line-height: 1.45; }

/* ── Menu ────────────────────────────────────────────── */
.menu {
  position: fixed; z-index: 30; min-width: 232px;
  top: calc(var(--bar) + env(safe-area-inset-top) - 4px); right: max(12px, env(safe-area-inset-right));
  background: var(--paper); border: 1px solid var(--ink); border-radius: 2px;
  box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 6px 0;
  display: none;
}
.menu.open { display: block; }
.menu button { width: 100%; text-align: left; padding: 9px 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 18px; font-size: 14px; }
.menu button:hover { background: var(--wash); }
.menu button span { color: var(--ink-3); font-size: 12px; }
.menu .danger { color: var(--accent); }
.menu hr { border: 0; border-top: 1px solid var(--rule); margin: 6px 0; }
.menu .label { padding: 8px 16px 4px; font-size: 11px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }

/* ── Dialog ──────────────────────────────────────────── */
dialog {
  border: 1px solid var(--ink); border-radius: 2px; padding: 0; width: min(480px, calc(100vw - 32px));
  background: var(--paper); color: var(--ink);
}
dialog::backdrop { background: rgba(0,0,0,.25); }
dialog form { padding: 22px; display: grid; gap: 14px; }
dialog h3 { margin: 0; font-size: 17px; }
dialog p { margin: 0; color: var(--ink-2); font-size: 13px; }
dialog input {
  font: 16px var(--sans); padding: 10px 12px; border: 1px solid var(--rule-2); border-radius: 2px;
  background: var(--paper); color: var(--ink); width: 100%;
}
dialog input:focus { outline: 0; border-color: var(--ink); }
dialog .row { display: flex; justify-content: flex-end; gap: 8px; }
dialog .err { color: var(--accent); }

/* ── Drop overlay ────────────────────────────────────── */
.drop { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; background: color-mix(in srgb, var(--paper) 88%, transparent); border: 3px solid var(--accent); font-weight: 700; font-size: 20px; }
.drop.on { display: grid; }

/* ── Wider screens ───────────────────────────────────── */
@media (min-width: 1000px) {
  .seg .wide-only { display: block; }
  .status .keys { display: block; }
}
@media (max-width: 640px) {
  :root { --bar: 50px; }
  .bar { grid-template-columns: auto 1fr auto; gap: 8px; }
  .doc-title { display: none; }
  .seg { justify-content: center; gap: 20px; }
  .btn .sub, .hide-sm { display: none; }
  .btn { padding: 0 12px; }
  .md { padding: 22px 18px 30vh; font-size: 16px; }
  .md h1 { font-size: 1.75em; }
  #src, .panes[data-view="write"] #src { padding: 22px max(18px, env(safe-area-inset-right)) 40vh max(18px, env(safe-area-inset-left)); font-size: 16px; line-height: 1.55; }
  .panes[data-view="split"] { grid-template-columns: 1fr; }
  .panes[data-view="split"] #srcPane { display: none; }
}

/* ── Print: only the document ───────────────────────── */
@page { margin: 16mm 15mm; }
@media print {
  :root, :root[data-theme="dark"] {
    --paper: #fff; --ink: #000; --ink-2: #444; --ink-3: #777; --rule: #d8d8d8; --rule-2: #c4c4c4;
    --wash: #f3f3f3; --code-bg: #f4f4f2; --link: #1946d2; color-scheme: light;
  }
  html, body { height: auto; overflow: visible; display: block; background: #fff; }
  .bar, .status, .drawer, .scrim, .menu, dialog, .drop, #srcPane, .copy-code { display: none !important; }
  .panes { display: block !important; }
  #outPane { display: block !important; overflow: visible; }
  .md { max-width: none; padding: 0; font-size: 10.5pt; line-height: 1.5; }
  .md pre code { font-size: 8.75pt; white-space: pre-wrap; }
  .md pre { white-space: pre-wrap; break-inside: avoid; }
  .md h1, .md h2, .md h3, .md h4 { break-after: avoid; }
  .md tr, .md img, .md blockquote { break-inside: avoid; }
  .md table { display: table; width: auto; }
  .md a { color: inherit; text-decoration: underline; text-decoration-color: #aaa; }
  .md li.task > input { accent-color: #000; }
  .md pre, .md th, .md :not(pre) > code { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>

const WELCOME = `# Draft

A plain Markdown scratchpad. Write, preview, copy, print. Nothing leaves this device.

## How it works

| Do | How |
| --- | --- |
| Switch view | **Write** / **Preview**, or \`⌘⇧P\` |
| Copy | Copies what you’re looking at: Markdown in Write, formatted in Preview |

## Notes

- [x] Saves as you type
- [ ] On iPhone: Share → **Add to Home Screen**
- Formatted copy pastes as rich text in Docs and Slack, and as Markdown in a terminal

claude "summarize this"   # paste straight into Claude Code or Codex
\`\`\`

> Delete this note from ⋯ when you’re done with it.
`;

/* ── Storage ──────────────────────────────────────── */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let notes = store.get(KEY, null);
if (!Array.isArray(notes) || !notes.length) {
  notes = [{ id: uid(), text: WELCOME, updated: Date.now() }];
  store.set(KEY, notes);
}
let cur = notes.find(n => n.id === store.get(CUR, null)) || notes[0];
let view = store.get(VIEW, 'write');
if (!['write', 'preview', 'split'].includes(view)) view = 'write';

let saveTimer;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
function saveNow() {
  clearTimeout(saveTimer);
  if (!store.set(KEY, notes)) toast('Storage is full — download your note');
  store.set(CUR, cur.id);
}
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
window.addEventListener('storage', (e) => {
  if (e.key !== KEY || document.activeElement === src) return;
  const fresh = store.get(KEY, null);
  if (!Array.isArray(fresh) || !fresh.length) return;
  notes = fresh; cur = notes.find(n => n.id === cur.id) || notes[0]; load();
});

/* ── Markdown ─────────────────────────────────────── */
const esc = (s) => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const renderer = new marked.Renderer();
renderer.code = (code, info) => {
  const lang = (info || '').trim().split(/\s+/)[0].toLowerCase();
  let html;
  try {
    html = lang && hljs.getLanguage(lang) ? hljs.highlight(code, { language: lang, ignoreIllegals: true }).value : esc(code);
  } catch { html = esc(code); }
  return `<pre><code${lang ? ` class="language-${esc(lang)}"` : ''}>${html}</code></pre>\n`;
};
renderer.listitem = (text, task) => task ? `<li class="task">${text}</li>\n` : `<li>${text}</li>\n`;
renderer.checkbox = (checked) => `<input type="checkbox"${checked ? ' checked' : ''}> `;
marked.use({ gfm: true, breaks: false, renderer });

DOMPurify.addHook('afterSanitizeAttributes', (node) => {
  if (node.tagName === 'A' && node.getAttribute('href') && !node.getAttribute('href').startsWith('#')) {
    node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer');
  }
});

function absolutize(base) {
  if (!base) return;
  const fix = (el, attr) => {
    const v = el.getAttribute(attr);
    if (!v || /^([a-z][a-z0-9+.-]*:|\/\/|#|data:)/i.test(v)) return;
    try { el.setAttribute(attr, new URL(v, base).href); } catch {}
  };
  out.querySelectorAll('img[src]').forEach(el => fix(el, 'src'));
  out.querySelectorAll('a[href]').forEach(el => fix(el, 'href'));
}

function render() {
  const text = src.value;
  if (!text.trim()) { out.innerHTML = '<p class="empty">Nothing to preview.</p>'; return; }
  out.innerHTML = DOMPurify.sanitize(marked.parse(text), { ADD_ATTR: ['target'] });
  absolutize(cur.base);
  out.querySelectorAll('li.task > input').forEach((box, i) => { box.dataset.i = i; });
  out.querySelectorAll('pre').forEach(pre => {
    const b = document.createElement('button');
    b.className = 'copy-code'; b.type = 'button'; b.textContent = 'Copy';
    pre.appendChild(b);
  });
}
let renderQueued = false;
function renderSoon() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

/* Clicking a checkbox in preview edits the source, like GitHub. */
out.addEventListener('click', (e) => {
  const box = e.target.closest('li.task > input');
  if (box) { toggleTask(+box.dataset.i, box.checked); return; }
  const cb = e.target.closest('.copy-code');
  if (cb) {
    const code = cb.parentElement.querySelector('code').textContent;
    writeText(code).then(() => flash(cb, 'Copied'));
  }
});
function toggleTask(index, checked) {
  const lines = src.value.split('\n');
  let fence = null, n = -1;
  for (let i = 0; i < lines.length; i++) {
    const f = lines[i].match(/^\s{0,3}(`{3,}|~{3,})/);
    if (f) { if (!fence) fence = f[1]; else if (f[1][0] === fence[0] && f[1].length >= fence.length) fence = null; continue; }
    if (fence) continue;
    const m = lines[i].match(/^(\s*(?:>\s*)*(?:[-*+]|\d+[.)])\s+)\[([ xX])\]/);
    if (m && ++n === index) {
      lines[i] = m[1] + (checked ? '[x]' : '[ ]') + lines[i].slice(m[0].length);
      setText(lines.join('\n'));
      return;
    }
  }
}

/* ── Notes ────────────────────────────────────────── */
function titleOf(text) {
  const line = (text || '').split('\n').find(l => l.trim()) || '';
  const t = line.replace(/^\s*(#{1,6}\s+|>\s*|[-*+]\s+(\[[ xX]\]\s+)?|\d+[.)]\s+)/, '').replace(/[*_`~]/g, '').trim();
  return t.slice(0, 80) || 'Untitled';
}
function fmtDate(t) {
  const d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}
function load() {
  src.value = cur.text;
  src.scrollTop = 0; $('#outPane').scrollTop = 0;
  updateMeta(); render(); renderList();
}
function setText(text) {
  // Replace whole text but keep it undoable where the browser allows.
  src.focus({ preventScroll: true });
  src.select();
  if (!document.execCommand('insertText', false, text)) { src.value = text; onInput(); }
  src.setSelectionRange(0, 0);
  if (view === 'preview') src.blur();
}
function onInput() {
  cur.text = src.value; cur.updated = Date.now();
  saveSoon(); updateMeta(); renderSoon();
}
function updateMeta() {
  const t = titleOf(cur.text);
  $('#docTitle').textContent = t;
  document.title = t === 'Untitled' ? 'Draft' : `${t} — Draft`;
  const words = (cur.text.match(/[\p{L}\p{N}][\p{L}\p{N}'’_-]*/gu) || []).length;
  $('#stats').textContent = `${words.toLocaleString()} ${words === 1 ? 'word' : 'words'} · ${cur.text.length.toLocaleString()} chars`;
}
function renderList() {
  const list = $('#noteList');
  list.innerHTML = '';
  [...notes].sort((a, b) => b.updated - a.updated).forEach((n, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.setAttribute('aria-current', n.id === cur.id);
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t"></span><span class="d">${fmtDate(n.updated)}</span>`;
    b.querySelector('.t').textContent = titleOf(n.text);
    b.onclick = () => { switchTo(n); closeDrawer(); };
    li.appendChild(b); list.appendChild(li);
  });
}
function switchTo(n) { saveNow(); cur = n; store.set(CUR, cur.id); load(); }
function newNote(text = '', base) {
  if (!cur.text.trim() && !text) { setView('write'); src.focus(); return; } // reuse the empty one
  const n = { id: uid(), text, updated: Date.now() };
  if (base) n.base = base;
  notes.push(n); switchTo(n);
  if (!text) { setView('write'); src.focus(); }
}
function deleteNote() {
  if (cur.text.trim() && !confirm(`Delete “${titleOf(cur.text)}”? This can’t be undone.`)) return;
  notes = notes.filter(n => n !== cur);
  if (!notes.length) notes.push({ id: uid(), text: '', updated: Date.now() });
  cur = [...notes].sort((a, b) => b.updated - a.updated)[0];
  saveNow(); load(); toast('Deleted');
}

/* ── View ─────────────────────────────────────────── */
function setView(v) {
  if (v === 'split' && !matchMedia('(min-width: 1000px)').matches) v = 'preview';
  view = v; panes.dataset.view = v; store.set(VIEW, v);
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
  $('#copySub').textContent = v === 'preview' ? 'Formatted' : 'Markdown';
  if (v !== 'write') render();
  if (v === 'write' && matchMedia('(hover: hover)').matches) src.focus({ preventScroll: true });
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setView(b.dataset.view));
const toggleView = () => setView(view === 'write' ? 'preview' : 'write');

/* ── Clipboard ────────────────────────────────────── */
function legacyCopy(fn) {
  const ok = (() => { try { fn(); return document.execCommand('copy'); } catch { return false; } })();
  window.getSelection().removeAllRanges();
  return ok;
}
async function writeText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0';
    document.body.appendChild(ta);
    const ok = legacyCopy(() => { ta.select(); });
    ta.remove(); return ok;
  }
}
/* HTML for rich paste: inline the bits other apps understand. */
function clipboardHTML() {
  render();
  const root = out.cloneNode(true);
  root.querySelectorAll('.copy-code').forEach(el => el.remove());
  root.querySelectorAll('input[type=checkbox]').forEach(el => el.replaceWith(document.createTextNode(el.checked ? '☑ ' : '☐ ')));
  const mono = 'font-family:SFMono-Regular,Menlo,Consolas,monospace;';
  const S = {
    table: 'border-collapse:collapse;', th: 'border:1px solid #c4c4c4;padding:6px 12px;background:#f3f3f3;font-weight:bold;text-align:left;',
    td: 'border:1px solid #c4c4c4;padding:6px 12px;vertical-align:top;', pre: 'background:#f4f4f2;padding:12px;' + mono + 'font-size:13px;white-space:pre;',
    blockquote: 'border-left:3px solid #111;margin:0 0 1em;padding:0 1em;color:#555;',
  };
  for (const [tag, style] of Object.entries(S)) root.querySelectorAll(tag).forEach(el => el.setAttribute('style', style));
  root.querySelectorAll(':not(pre) > code').forEach(el => el.setAttribute('style', mono + 'background:#f4f4f2;padding:1px 4px;font-size:0.9em;'));
  root.querySelectorAll('pre code').forEach(el => el.setAttribute('style', mono));
  root.querySelectorAll('[class]').forEach(el => el.removeAttribute('class'));
  return `<meta charset="utf-8"><div style="font-family:Helvetica,Arial,sans-serif;">${root.innerHTML}</div>`;
}
async function copyRich() {
  const html = clipboardHTML(), md = src.value;
  try {
    if (!window.ClipboardItem) throw 0;
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([md], { type: 'text/plain' }), // terminals get Markdown
    })]);
    return true;
  } catch {
    const prev = view; if (view === 'write') { panes.dataset.view = 'preview'; }
    const ok = legacyCopy(() => { const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
    panes.dataset.view = prev; return ok;
  }
}
function fenced(text) {
  const runs = text.match(/`{3,}/g) || [];
  const n = Math.max(3, ...runs.map(r => r.length + 1));
  const f = '`'.repeat(n);
  return `${f}markdown\n${text.replace(/\n+$/, '')}\n${f}`;
}
async function doCopy(kind) {
  cur.text = src.value;
  let ok, msg;
  if (kind === 'rich') { ok = await copyRich(); msg = 'Copied formatted'; }
  else if (kind === 'fence') { ok = await writeText(fenced(src.value)); msg = 'Copied as code block'; }
  else { ok = await writeText(src.value); msg = 'Copied Markdown'; }
  if (ok === false) { toast('Copy blocked — select and copy manually'); return; }
  flash($('#copyBtn'), 'Copied', true);
  if (kind === 'fence' || (kind === 'rich') !== (view === 'preview')) toast(msg);
}
$('#copyBtn').onclick = () => doCopy(view === 'preview' ? 'rich' : 'md');

function flash(btn, text, keepIcon) {
  const lbl = keepIcon ? btn.querySelector('.lbl') : btn;
  const sub = btn.querySelector('.sub');
  clearTimeout(btn._t);
  if (!btn._orig) btn._orig = lbl.textContent;
  lbl.textContent = text; btn.classList.add('done'); if (sub) sub.hidden = true;
  btn._t = setTimeout(() => { lbl.textContent = btn._orig; btn._orig = null; btn.classList.remove('done'); if (sub) sub.hidden = false; }, 1300);
}
let toastEl;
function toast(msg) {
  if (!toastEl) {
    toastEl = document.createElement('div');
    toastEl.style.cssText = 'position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:9px 16px;border-radius:2px;font-size:13px;font-weight:600;z-index:50;transition:opacity .2s;pointer-events:none;white-space:nowrap';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg; toastEl.style.opacity = 1;
  clearTimeout(toastEl._t); toastEl._t = setTimeout(() => { toastEl.style.opacity = 0; }, 1800);
}

/* ── Print ────────────────────────────────────────── */
let titleBeforePrint;
window.addEventListener('beforeprint', () => {
  render();
  titleBeforePrint = document.title;
  document.title = titleOf(src.value).replace(/[\\/:*?"<>|]+/g, ' ').trim(); // becomes the PDF filename
});
window.addEventListener('afterprint', () => { if (titleBeforePrint) document.title = titleBeforePrint; });
function doPrint() { render(); window.print(); }
$('#printBtn').onclick = doPrint;

/* ── Files & URLs ─────────────────────────────────── */
function download() {
  const name = titleOf(src.value).replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 60) || 'note';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([src.value], { type: 'text/markdown;charset=utf-8' }));
  a.download = `${name}.md`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function openFile(file) {
  if (!file) return;
  const text = await file.text();
  newNote(text); setView('preview'); toast(`Opened ${file.name}`);
}
$('#fileIn').onchange = (e) => { openFile(e.target.files[0]); e.target.value = ''; };

function toRawURL(input) {
  let s = input.trim();
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  const u = new URL(s);
  if (u.hostname === 'github.com') {
    const [owner, repo, kind, ref, ...rest] = u.pathname.split('/').filter(Boolean);
    if (!owner || !repo) throw new Error('That link doesn’t point to a repo or file.');
    const r = repo.replace(/\.git$/, '');
    if (kind === 'blob' || kind === 'raw') return `https://raw.githubusercontent.com/${owner}/${r}/${ref}/${rest.join('/')}`;
    const dir = kind === 'tree' ? `${ref}/${rest.length ? rest.join('/') + '/' : ''}` : 'HEAD/';
    return `https://raw.githubusercontent.com/${owner}/${r}/${dir}README.md`;
  }
  if (u.hostname === 'gist.github.com') {
    const [owner, id] = u.pathname.split('/').filter(Boolean);
    return `https://gist.githubusercontent.com/${owner}/${id}/raw`;
  }
  return u.href;
}
async function importURL(input) {
  const raw = toRawURL(input);
  const res = await fetch(raw);
  if (!res.ok) throw new Error(res.status === 404 ? 'Not found. Private repos can’t be fetched — copy the raw text instead.' : `Fetch failed (${res.status}).`);
  const text = await res.text();
  newNote(text, raw); setView('preview');
}
const dlg = $('#urlDlg');
$('#urlForm').addEventListener('submit', async (e) => {
  if (e.submitter && e.submitter.value === 'cancel') return;
  e.preventDefault();
  const err = $('#urlErr'), go = $('#urlGo');
  err.hidden = true; go.disabled = true; go.textContent = 'Importing…';
  try { await importURL($('#urlIn').value); dlg.close(); $('#urlIn').value = ''; }
  catch (x) { err.textContent = x.message || 'Couldn’t load that URL.'; err.hidden = false; }
  finally { go.disabled = false; go.textContent = 'Import'; }
});

/* Drag & drop */
let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
window.addEventListener('dragenter', (e) => { if (hasFiles(e)) { dragDepth++; $('#drop').classList.add('on'); } });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('on'); } });
window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('on');
  openFile(e.dataTransfer.files[0]);
});

/* ── Drawer & menu ────────────────────────────────── */
const drawer = $('#drawer'), scrim = $('#scrim'), menu = $('#menu');
function openDrawer() { renderList(); drawer.classList.add('open'); scrim.classList.add('open'); }
function closeDrawer() { drawer.classList.remove('open'); scrim.classList.remove('open'); }
$('#notesBtn').onclick = () => drawer.classList.contains('open') ? closeDrawer() : openDrawer();
$('#docTitle').onclick = openDrawer;
scrim.onclick = closeDrawer;
$('#newBtn').onclick = () => { closeDrawer(); newNote(); };

function closeMenu() { menu.classList.remove('open'); $('#moreBtn').setAttribute('aria-expanded', 'false'); }
$('#moreBtn').onclick = (e) => {
  e.stopPropagation();
  const open = !menu.classList.contains('open');
  menu.classList.toggle('open', open); $('#moreBtn').setAttribute('aria-expanded', open);
};
document.addEventListener('click', (e) => { if (!menu.contains(e.target)) closeMenu(); });

const THEMES = ['auto', 'light', 'dark'];
function applyTheme(t) {
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  $('#themeLbl').textContent = t[0].toUpperCase() + t.slice(1);
}
let theme = store.get(THEME, 'auto'); if (!THEMES.includes(theme)) theme = 'auto';
applyTheme(theme);

menu.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act !== 'theme') closeMenu();
  ({
    'copy-md': () => doCopy('md'),
    'copy-rich': () => doCopy('rich'),
    'copy-fence': () => doCopy('fence'),
    'print': doPrint,
    'download': download,
    'new': () => newNote(),
    'import': () => { $('#urlErr').hidden = true; dlg.showModal(); },
    'open': () => $('#fileIn').click(),
    'theme': () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set(THEME, theme); applyTheme(theme); },
    'delete': deleteNote,
  })[act]();
});

/* ── Editor ───────────────────────────────────────── */
function insert(text) {
  const ok = text ? document.execCommand('insertText', false, text)
    : src.selectionStart === src.selectionEnd || document.execCommand('delete');
  if (!ok) {
    src.setRangeText(text, src.selectionStart, src.selectionEnd, 'end'); onInput();
  }
}
function wrap(mark, after = mark) {
  const { selectionStart: s, selectionEnd: e, value: v } = src;
  const sel = v.slice(s, e);
  insert(mark + sel + after);
  src.setSelectionRange(s + mark.length, s + mark.length + sel.length);
}
function lineRange() {
  const v = src.value;
  const a = v.lastIndexOf('\n', src.selectionStart - 1) + 1;
  let b = v.indexOf('\n', Math.max(src.selectionEnd - (src.selectionEnd > src.selectionStart && v[src.selectionEnd - 1] === '\n' ? 1 : 0), a));
  if (b < 0) b = v.length;
  return [a, b];
}
function indent(out) {
  const [a, b] = lineRange();
  const block = src.value.slice(a, b);
  const next = block.split('\n').map(l => out ? l.replace(/^( {1,2}|\t)/, '') : '  ' + l).join('\n');
  if (next === block) return;
  const s = src.selectionStart, single = s === src.selectionEnd && !block.includes('\n');
  src.setSelectionRange(a, b); insert(next);
  if (single) { const p = Math.max(a, s + next.length - block.length); src.setSelectionRange(p, p); }
  else src.setSelectionRange(a, a + next.length);
}
function continueList(e) {
  const v = src.value, s = src.selectionStart;
  if (s !== src.selectionEnd) return;
  const a = v.lastIndexOf('\n', s - 1) + 1;
  const line = v.slice(a, s);
  const m = line.match(/^(\s*(?:>\s?)*)([-*+]|(\d+)([.)]))(\s+)(\[[ xX]\]\s+)?/);
  if (!m) return;
  e.preventDefault();
  if (line.length === m[0].length) { // empty item ends the list
    src.setSelectionRange(a, s); insert(''); return;
  }
  const marker = m[3] ? (parseInt(m[3], 10) + 1) + m[4] : m[2];
  insert('\n' + m[1] + marker + m[5] + (m[6] ? '[ ] ' : ''));
}
src.addEventListener('input', onInput);
src.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (e.isComposing) return;
  if (mod && !e.shiftKey && !e.altKey && k === 'b') { e.preventDefault(); wrap('**'); }
  else if (mod && !e.shiftKey && !e.altKey && k === 'i') { e.preventDefault(); wrap('_'); }
  else if (mod && !e.shiftKey && !e.altKey && k === 'k') {
    e.preventDefault();
    const sel = src.value.slice(src.selectionStart, src.selectionEnd);
    if (/^https?:\/\/\S+$/.test(sel)) { const s = src.selectionStart; insert(`[](${sel})`); src.setSelectionRange(s + 1, s + 1); }
    else { wrap('[', '](url)'); const p = src.selectionEnd + 2; src.setSelectionRange(p, p + 3); }
  }
  else if (mod && !e.shiftKey && k === 'e') { e.preventDefault(); wrap('`'); }
  else if (e.key === 'Tab' && !mod && !e.altKey) { e.preventDefault(); indent(e.shiftKey); }
  else if (e.key === 'Enter' && !e.shiftKey && !mod && !e.altKey) continueList(e);
});

/* Paste a URL over selected text → link */
src.addEventListener('paste', (e) => {
  const t = e.clipboardData?.getData('text/plain') || '';
  const { selectionStart: s, selectionEnd: en } = src;
  if (s !== en && /^https?:\/\/\S+$/.test(t.trim()) && !src.value.slice(s, en).includes('\n')) {
    e.preventDefault(); insert(`[${src.value.slice(s, en)}](${t.trim()})`);
  }
});

/* Global shortcuts */
document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && e.shiftKey && k === 'p') { e.preventDefault(); toggleView(); }
  else if (mod && !e.shiftKey && k === 's') { e.preventDefault(); saveNow(); toast('Saved on this device'); }
  else if (e.key === 'Escape') { closeMenu(); closeDrawer(); }
});

/* ── Boot ─────────────────────────────────────────── */
load();
setView(view);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
